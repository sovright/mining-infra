[package]
name = "sovright-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast block relay protocol for the Sovright Zcash mining network"
repository = "https://github.com/sovright/mining-infra"

[dependencies]
zcash-equihash-validator = { path = "../zcash-equihash-validator" }
thiserror = { workspace = true }
hex = { workspace = true }
blake2b_simd = { workspace = true }
siphasher = "1.0"
reed-solomon-erasure = "6.0"
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "time", "sync"] }
hmac = "0.12"
sha2 = { workspace = true }
bytes = "1.5"
subtle = "2.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
equihash = { workspace = true }
socket2 = "0.5"
arbitrary = { version = "1", features = ["derive"], optional = true }

[features]
arbitrary = ["dep:arbitrary"]
generate-corpus = []

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
rand = "0.8"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "relay_bench"
harness = false
