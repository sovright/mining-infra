[package]
name = "sovright-mesh-enroll"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# PoC for the miner relay onboarding flow (see docs/miner-onboarding.md):
# invite-code enrollment that auto-adds a miner-generated mesh key to the
# relay authorized-key store. Deliberately dep-light — only crates already
# vendored in the workspace + std. TLS on the enroll hop is a documented
# follow-up (§4.1 / §5); the PoC server speaks plain HTTP on loopback.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
getrandom = "0.2"
# Constant-time ops-token comparison. Same primitives the relay transport
# already uses (sovright-relay: sha2 + subtle); both are already in the
# workspace lockfile, so no new dependency enters the tree.
sha2 = { workspace = true }
subtle = "2.5"

[[bin]]
name = "mesh-enroll-server"
path = "src/bin/server.rs"

[[bin]]
name = "mesh-enroll"
path = "src/bin/client.rs"
