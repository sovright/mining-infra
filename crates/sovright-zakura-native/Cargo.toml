[package]
name = "sovright-zakura-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Receive blocks from Zakura native P2P peers for the Sovright relay"
repository.workspace = true
publish = false

[features]
# Off by default. The Zakura crates need Rust 1.97, newer than the toolchain the
# default workspace build supports, so only this feature pulls them in.
zakura-native = [
    "dep:indexmap",
    "dep:tokio",
    "dep:tower",
    "dep:tracing",
    "dep:zakura-chain",
    "dep:zakura-network",
    "dep:zakura-quic",
]
# A fake native peer for tests in other crates. It compiles only together with
# `zakura-native`, so asking for it alone pulls in nothing.
test-support = ["dep:tempfile"]

[dependencies]
indexmap = { version = "2.8", optional = true }
tempfile = { version = "3", optional = true }
tokio = { workspace = true, optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tracing = { workspace = true, optional = true }
# Exact pins: Zakura publishes these crates as internal, and their APIs change
# between releases. Both come from the v1.8.6 release.
zakura-chain = { version = "=14.0.0", optional = true }
zakura-network = { version = "=15.0.0", optional = true }
# The node id parser `zakura-network` 15.0.0 reads bootstrap peers with. Already in
# the lock through zakura-network; pinned to the version it uses.
zakura-quic = { version = "=0.5.0", optional = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
