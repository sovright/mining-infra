# Sovright Relay Sidecar Configuration Example
# Copy to config.toml and modify as needed

# Zebra JSON-RPC URL
zebra_url = "http://127.0.0.1:8232"

# Relay peer addresses (at least one required)
relay_peers = [
    "relay.example.com:8333",
    # "backup-relay.example.com:8333",
]

# Authentication key (32 bytes hex, optional)
# Generate with: openssl rand -hex 32
# auth_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Local bind address for UDP socket
bind_addr = "0.0.0.0:0"

# FEC profile for relay traffic. These values must match the relay nodes and
# any P2P ingress bridge sending into the same canary path.
data_shards = 10
parity_shards = 3

# Template poll interval in milliseconds
# Lower = faster detection, higher CPU usage
poll_interval_ms = 100

# Announce local Zebra templates into the relay network.
# Keep true for a tip-synced pool sidecar; set false for receive-only dry runs.
announce_templates = true

# Receive reconstructed compact blocks from the Sovright relay client.
# Dry-run receive is safe for observability; it does not call submitblock.
receive_relay_blocks = false

# Submit eligible relay-received blocks to Zebra.
# Requires receive_relay_blocks = true. Keep false until mainnet cutover signoff.
enable_submitblock = false

# Bounds for incomplete segmented raw blocks received from the relay network.
raw_segment_max_incomplete_blocks = 128
raw_segment_max_payload_bytes = 67108864
raw_segment_ttl_secs = 120

# Optional client-side UDP pacing for outbound relay announcements.
# Zero disables pacing. Useful for large raw-block fallback drills.
send_burst_packets = 0
send_burst_delay_micros = 0

# Optional Prometheus textfile for receive/reassembly/submit metrics.
# metrics_textfile = "/var/lib/sovright-relay-sidecar/metrics.prom"

# Safety gate that sits in front of submit_block for relay-received blocks.
# Independent of enable_submitblock so the gate can run "shadow" — exercising
# the decision logic on every reassembled candidate without enable_submitblock
# being on. Turn this on during Phase 3 staging; flip enable_submitblock on
# during Phase 4 once gate metrics have been clean for 48 hr.
[submit_gate]
# Master switch. Default false.
enabled = false
# Allowed block heights below the local tip. Default 3 = one-deep reorg tolerance.
allowed_below = 3
# Dedup window in seconds. Default 300 (5 minutes).
dedup_window_secs = 300
# Maximum entries in the dedup ring. Default 256.
dedup_capacity = 256
