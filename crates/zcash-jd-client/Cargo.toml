[package]
name = "zcash-jd-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Job Declaration Client for Zcash Stratum V2"

[[bin]]
name = "zcash-jd-client"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
byteorder = "1.5"
clap = { version = "4.4", features = ["derive", "env"] }
toml = "0.8"
hex.workspace = true
reqwest = { version = "0.12", features = ["json"] }
serde_json.workspace = true
sha2.workspace = true

# Local dependencies
zcash-template-provider = { path = "../zcash-template-provider" }
zcash-jd-server = { path = "../zcash-jd-server" }
zcash-mining-protocol = { path = "../zcash-mining-protocol" }
zcash-equihash-validator = { path = "../zcash-equihash-validator" }
sovright-noise = { path = "../sovright-noise" }
zcash-pool-common = { path = "../zcash-pool-common" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = "3"
# Tier-2 full-chain integration test (tests/tier2_chain_test.rs) drives a real
# in-process pool server alongside the in-process JD client. No dependency
# cycle: zcash-pool-server does not depend on zcash-jd-client. Relay feature is
# off (not needed for the chain under test).
zcash-pool-server = { path = "../zcash-pool-server", default-features = false }
zcash-template-provider = { path = "../zcash-template-provider", features = ["test-support"] }
