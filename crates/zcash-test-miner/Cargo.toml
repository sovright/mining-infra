[package]
name = "zcash-test-miner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU Equihash test miner for Sovright pool testing"

[[bin]]
name = "zcash-test-miner"
path = "src/main.rs"

[dependencies]
zcash-mining-protocol = { path = "../zcash-mining-protocol" }
zcash-pool-common = { path = "../zcash-pool-common" }
sovright-noise = { path = "../sovright-noise" }
equihash = { workspace = true, features = ["solver"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde_json = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
zcash-pool-common = { path = "../zcash-pool-common", features = ["test-support"] }
