[package]
name = "sovright-p2p-ingress"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Zcash P2P ingress daemon for the Sovright relay network"
repository.workspace = true

[dependencies]
sovright-relay = { path = "../sovright-relay" }
sovright-relay-sidecar = { path = "../sovright-relay-sidecar" }
zcash-equihash-validator = { path = "../zcash-equihash-validator" }
blake2b_simd = { workspace = true }
hex = { workspace = true }
jsonrpsee = { version = "0.24", features = ["http-client", "server"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zcash_primitives = { workspace = true }
zcash_protocol = { workspace = true }

[dev-dependencies]
