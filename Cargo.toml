[workspace]
resolver = "3"
members = [
    "crates/*",
]
# Untracked WIP directories under crates/ that have no root Cargo.toml yet.
# Excluded so the crates/* glob can load the workspace; harmless on CI where
# these paths do not exist.
exclude = [
    "crates/bedrock-forge",
    "crates/bedrock-noise",
    "crates/forge-sidecar",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sovright/mining-infra"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
blake2b_simd = "1.0"
byteorder = "1.5"
equihash = "0.2"
sha2 = "0.10"
# Zcash transaction parsing + ZIP-244 txid/auth-digest (for short_id-ing block
# transactions the tx cache missed). `circuits`/`multicore` (halo2 proving) are
# not needed -- we only parse and hash, never verify proofs.
zcash_primitives = { version = "0.28", default-features = false, features = ["std"] }
zcash_protocol = { version = "0.9", default-features = false }
