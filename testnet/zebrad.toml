# Sovright Internal Testnet — Zebra Configuration
# Standard Zcash testnet, internal miner enabled, no peers (isolated).
#
# SETUP: Run zebrad-bootstrap.toml first to populate state, then run this.
# The internal miner competes on real testnet difficulty. For Phase 1 testing
# we don't need PoW-disabled: getblocktemplate works with any synced chain.

[mining]
miner_address = 't27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v'
internal_miner = true

[network]
network = "Testnet"
listen_addr = "0.0.0.0:18233"
initial_testnet_peers = []

[rpc]
listen_addr = "0.0.0.0:18232"
enable_cookie_auth = false

[mempool]
debug_enable_at_height = 0

[state]
ephemeral = false
cache_dir = "/data/zebra"

[consensus]
checkpoint_sync = false
