name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write          # for cosign keyless signing

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: job-declarator
            dockerfile: docker/Dockerfile.job-declarator
          - name: translator-proxy
            dockerfile: docker/Dockerfile.translator-proxy
          - name: sovright-relay
            dockerfile: docker/Dockerfile.sovright-relay

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/sovright/${{ matrix.name }}
          tags: |
            type=edge,branch=main
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image (keyless, OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/sovright/${{ matrix.name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Emit build provenance summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/sovright/${{ matrix.name }}
        run: |
          {
            echo "### ${IMAGE}"
            echo ""
            echo "- digest: \`${DIGEST}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- signed: keyless cosign via OIDC"
          } >> "${GITHUB_STEP_SUMMARY}"
