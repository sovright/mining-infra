name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tier2-chain:
    # Full-chain mining integration test (pool + JDC + proxy + real CPU
    # Equihash solver). It is #[ignore]d so the main `cargo test --workspace`
    # job stays fast and deterministic; this job runs it explicitly. It spawns
    # the proxy and miner binaries, so the workspace must be built first. Marked
    # non-blocking (continue-on-error) because it depends on a real CPU solver
    # finding a solution within the time budget — a slow runner should warn, not
    # block the PR.
    name: Tier-2 full-chain mining (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace (produces proxy + miner binaries the test spawns)
        run: cargo build --workspace --all-targets
      - name: Run tier-2 chain test
        run: cargo test -p zcash-jd-client --test tier2_chain_test -- --ignored --nocapture

  bound-path-diagnostic:
    # Temporary, for #134. `cargo test` shows nobody the output of a test that passes, so this
    # keeps the hop-by-hop report either way, alone and among the tests the largest body failed
    # with. The `test` job above is left as it is.
    #
    # Each test step keeps cargo's exit code through `tee` and lets the next one run, and the
    # verdict at the end decides. A build failure stops the job in every case. The cases that
    # turn a part of the change off may lose the largest body, and nothing else: any other
    # failure fails them too. In the others, a datagram dropped at a socket fails the job even
    # if FEC made up for it.
    name: Bound path diagnostic (${{ matrix.run }})
    runs-on: ubuntu-latest
    env:
      BOUND_PATH_CASE: ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: alone
            case: defaults
            may_lose_the_block: false
            measure: true
            largest: a_body_of_nearly_the_largest_size -- --nocapture --test-threads=1
          - run: with-the-rest
            case: defaults
            may_lose_the_block: false
            measure: false
            largest: -- --nocapture
          - run: before
            case: before
            may_lose_the_block: true
            measure: true
            largest: a_body_of_nearly_the_largest_size -- --nocapture --test-threads=1
          - run: drain-only
            case: drain-only
            may_lose_the_block: true
            measure: true
            largest: a_body_of_nearly_the_largest_size -- --nocapture --test-threads=1
          - run: pacing-only
            case: pacing-only
            may_lose_the_block: true
            measure: true
            largest: a_body_of_nearly_the_largest_size -- --nocapture --test-threads=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        id: build
        run: cargo test --locked -p sovright-relay-sidecar --bin relay-sidecar --no-run
      - name: Largest body
        id: largest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p sovright-relay-sidecar --bin relay-sidecar ${{ matrix.largest }} 2>&1 | tee largest.log
      - name: Usual block
        id: usual
        if: ${{ matrix.measure }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p sovright-relay-sidecar --bin relay-sidecar a_block_of_the_usual_size -- --nocapture --test-threads=1 2>&1 | tee usual.log
      - name: Dual send
        id: dual
        if: ${{ matrix.measure }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p sovright-relay-sidecar --bin relay-sidecar a_dual_send_reports -- --ignored --nocapture --test-threads=1 2>&1 | tee dual.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bound-path-diagnostic-${{ matrix.run }}
          path: '*.log'
          if-no-files-found: warn
      - name: Verdict
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          LARGEST: ${{ steps.largest.outcome }}
          USUAL: ${{ steps.usual.outcome }}
          DUAL: ${{ steps.dual.outcome }}
          MAY_LOSE: ${{ matrix.may_lose_the_block }}
        run: |
          stop() { echo "::error::$1"; exit 1; }
          [ "$USUAL" = success ] || [ "$USUAL" = skipped ] || stop "the usual block failed"
          [ "$DUAL" = success ] || [ "$DUAL" = skipped ] || stop "the dual measurement failed"
          if [ "$LARGEST" != success ]; then
            [ "$MAY_LOSE" = true ] || stop "the largest body failed"
            grep -q 'gave up waiting for the block' largest.log || stop "failed, and not by losing the block"
            grep -q '^test result: FAILED. 0 passed; 1 failed;' largest.log || stop "more failed than the one test"
            echo "::notice::this case lost the largest body, as it may"
            exit 0
          fi
          dropped='queued and dropped Some\(\([0-9]+, [1-9][0-9]*\)\)'
          if grep -E "$dropped" ./*.log; then
            [ "$MAY_LOSE" = true ] || stop "a socket dropped datagrams"
            echo "::notice::a socket dropped datagrams in this case, as it may"
          fi
